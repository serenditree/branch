serenditree:
  log:
    level: INFO
    pretty: false
    properties: false
  fence:
    verification:
      paths: /api/v1/user/verify/callback/*
      scopes: profile,openid
    policies:
      enabled: false
    cronjobs:
      cleanup: 0 2 * * *
    error: "Unhandled error during authentication and authorization."
  root:
    user:
      user: ~
      password: ~
    seed:
      user: ~
      password: ~
quarkus:
  application:
    name: branch-poll
  datasource:
    db-kind: postgresql
    username: ${serenditree.root.user.user}
    password: ${serenditree.root.user.password}
    jdbc:
      telemetry: true
      url: jdbc:postgresql://root-user:5432/serenditree
  hibernate-orm:
    scripts:
      generation: none
    jdbc:
      statement-batch-size: 100
      statement-fetch-size: 100
    quote-identifiers:
      strategy: all
    log:
      jdbc-warnings: true
  log:
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{3.}] (%t) %s%e%n"
    category:
      "io.smallrye.health":
        level: WARN
      "io.opentelemetry":
        level: WARN
      "io.serenditree":
        level: ${serenditree.log.level}
  otel:
    enabled: true
    traces:
      sampler: traceidratio
    exporter:
      otlp:
        traces:
          endpoint: ~
  smallrye-openapi:
    path: /api/v1/poll/openapi
  swagger-ui:
    always-include: false
    path: /api/v1/poll/swagger
  scheduler:
    cron-type: unix
  shutdown:
    timeout: 10
  arc:
    exclude-dependency:
      "fence-extras-scheduler":
        group-id: io.serenditree
        artifact-id: fence-extras-scheduler
mp:
  messaging:
    incoming:
      seed-created:
        bootstrap:
          servers: root-wind:9092
        connector: smallrye-kafka
        value:
          deserializer: io.serenditree.branch.seed.model.serde.SeedDeserializerKafka
        group:
          id: io.serenditree.wind.poll
      seed-deleted:
        bootstrap:
          servers: root-wind:9092
        connector: smallrye-kafka
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        group:
          id: io.serenditree.wind.poll
      user-deleted:
        bootstrap:
          servers: root-wind:9092
        connector: smallrye-kafka
        key:
          deserializer: org.apache.kafka.common.serialization.LongDeserializer
        value:
          deserializer: org.apache.kafka.common.serialization.LongDeserializer
        group:
          id: io.serenditree.wind.poll
